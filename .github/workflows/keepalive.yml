name: keepalive

# GitHub turns off a public repository's scheduled workflows after 60 days
# without a commit. One dated line a week keeps the watchdog on.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d >> keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
